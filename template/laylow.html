<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            padding: 20px;
            background: linear-gradient(135deg, #00ff59 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        
        .info {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .track-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.35s ease;
            cursor: default;
            max-width: 900px;
            margin: 24px auto;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .track-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.18);
        }

        .track-cover {
            flex: 0 0 150px;
            width: 150px;
            height: 150px;
            background: #f0f0f0;
            overflow: hidden;
            border-radius: 6px 0 0 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info {
            padding: 16px 20px;
            flex: 1 1 auto;
        }
        
        .track-link {
            display: block;
            text-decoration: none;
            color: inherit;
            border-radius: 10px;
        }
        .track-link:focus,
        .track-link:hover {
            outline: none;
        }
        .track-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .track-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-details {
            font-size: 0.9em;
            color: #666;
        }
        
        .track-details p {
            margin: 5px 0;
        }
        
        .no-data {
            color: white;
            text-align: center;
            font-size: 1.2em;
            padding: 40px;
        }
    </style>
</head>
<body class="Laylow">

<h1 class="titre">Laylow - Track</h1>
<p class="info">Données Spotify récupérées :</p>

<div class="container">
{{if .Name}}
    <a class="track-link" href="https://open.spotify.com/intl-fr/track/67Pf31pl0PfjBfUmvYNDCL">
    <div class="track-card">
        <div class="track-cover">
            {{if .Album.Images}}
                <img class="track-image" src="{{(index .Album.Images 0).URL}}" alt="Album cover">
            {{end}}
        </div>
        <div class="track-info">
            <div class="track-title">{{.Name}}</div>
            <div class="track-details">
                <p><strong>Album :</strong> {{.Album.Name}}</p>
                <p><strong>Durée :</strong> {{.Duration}} ms</p>
                {{range .Artists}}
                    <p><strong>Artiste :</strong> {{.Name}}</p>
                {{end}}
            </div>
        </div>
    </div>
{{else}}
    <p class="no-data">Aucune donnée trouvée</p>
{{end}}
</div>

</body>
</html>
